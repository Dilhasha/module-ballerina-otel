[package]
org = "ballerina"
name = "otel"
version = "1.0.0"
keywords = ["Type/Driver", "Area/Developer Tools", "Vendor/Otel", "Observability", "tracing"]
distribution = "2201.14.0"

[build-options]
# Pin dependency resolution to the versions in Dependencies.toml: the build
# compiles against a distribution assembled by copyStdlibs from the stdlib
# versions in gradle.properties, so letting bal resolve to the latest on
# Central would drift out of sync with the merged balas.
sticky = true

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
path = "../native/build/libs/otel-extension-native-1.0.0.jar"
groupId = "ballerina"
artifactId = "otel-extension-native"
version = "1.0.0"

[[platform.java21.dependency]]
path = "./lib/opentelemetry-sdk-trace-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-sdk-trace"
version = "1.65.0"

[[platform.java21.dependency]]
path = "./lib/opentelemetry-sdk-metrics-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-sdk-metrics"
version = "1.65.0"

[[platform.java21.dependency]]
path = "./lib/opentelemetry-sdk-common-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-sdk-common"
version = "1.65.0"

[[platform.java21.dependency]]
path = "./lib/opentelemetry-common-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-common"
version = "1.65.0"

# NOTE: opentelemetry-api and opentelemetry-context are intentionally not
# packed: ballerina-rt shades both artifacts and its copies always win
# classloading. opentelemetry-sdk-logs is intentionally not packed: only the
# (unused) OTLP log exporter classes reference it. opentelemetry-semconv is
# not needed: the only used constant (service.name) is inlined in the native
# code.

[[platform.java21.dependency]]
path = "./lib/opentelemetry-exporter-otlp-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-exporter-otlp"
version = "1.65.0"

[[platform.java21.dependency]]
path = "./lib/opentelemetry-exporter-otlp-common-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-exporter-otlp-common"
version = "1.65.0"

[[platform.java21.dependency]]
path = "./lib/opentelemetry-exporter-common-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-exporter-common"
version = "1.65.0"

[[platform.java21.dependency]]
path = "./lib/opentelemetry-exporter-sender-okhttp-1.65.0.jar"
groupId = "io.opentelemetry"
artifactId = "opentelemetry-exporter-sender-okhttp"
version = "1.65.0"

[[platform.java21.dependency]]
path = "./lib/okhttp-jvm-5.4.0.jar"
groupId = "com.squareup.okhttp3"
artifactId = "okhttp-jvm"
version = "5.4.0"

[[platform.java21.dependency]]
path = "./lib/okio-jvm-3.17.0.jar"
groupId = "com.squareup.okio"
artifactId = "okio-jvm"
version = "3.17.0"

# kotlin-stdlib is bundled as a ProGuard-shrunk jar (see the size-reduction-test
# subproject): only the classes reachable from okhttp/okio are kept.
[[platform.java21.dependency]]
path = "./lib/kotlin-stdlib-2.2.21-slim.jar"
groupId = "org.jetbrains.kotlin"
artifactId = "kotlin-stdlib"
version = "2.2.21"
